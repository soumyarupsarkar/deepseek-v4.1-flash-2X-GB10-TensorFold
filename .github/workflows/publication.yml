name: Recipe and native CPU checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Portable recipe contracts
        run: python3 -B -m unittest discover -s tests/publication -v
      - name: Native controller contracts
        run: python3 -B -m unittest discover -s deployment/tests -v
      - name: Source, pins, syntax and local documentation
        run: python3 -B scripts/check_release.py
      - name: Example plan (no host actions)
        run: python3 -B cluster --config deployment/config/cluster.example.json plan
  native-cpu:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake g++
      - name: Pinned compiler, native CPU/server tests and C++ grammar bridge
        run: python3 -B scripts/native_ci.py --work "$RUNNER_TEMP/native-contracts"
