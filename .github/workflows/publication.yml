name: Offline publication checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Portable recipe contracts
        run: python3 -B -m unittest discover -s tests/publication -v
      - name: Source, pins, syntax and local documentation
        run: python3 -B scripts/check_release.py
      - name: Example plan (no host actions)
        run: python3 -B cluster --config deployment/config/cluster.example.json plan
